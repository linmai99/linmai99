<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>凛麦图鉴 - 于是麦麦决定离家出走</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 猫耳朵与猫尾巴自定义样式 */
    .cat-ear-left {
      position: absolute;
      top: -8px;
      left: 18px;
      width: 16px;
      height: 14px;
      background-color: #fbcfe8; /* 柔粉 */
      border-top-left-radius: 12px;
      border-top-right-radius: 4px;
      transform: rotate(-15deg);
      border: 2px solid #f472b6;
      border-bottom: none;
    }
    .cat-ear-right {
      position: absolute;
      top: -8px;
      right: 18px;
      width: 16px;
      height: 14px;
      background-color: #fbcfe8;
      border-top-left-radius: 4px;
      border-top-right-radius: 12px;
      transform: rotate(15deg);
      border: 2px solid #f472b6;
      border-bottom: none;
    }
    .cat-tail {
      position: absolute;
      right: -12px;
      bottom: 8px;
      width: 22px;
      height: 12px;
      border-right: 4px solid #f472b6;
      border-bottom: 4px solid #f472b6;
      border-bottom-right-radius: 12px;
      transform: rotate(-10deg);
    }

    /* 猫爪造型按钮 */
    .paw-btn {
      position: relative;
      padding-top: 8px;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }
    .paw-toe {
      width: 6px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
      display: inline-block;
      opacity: 0.6;
    }
  </style>
</head>
<body class="bg-[#fdfbf7] text-slate-700 min-h-screen pb-12 antialiased selection:bg-pink-100 selection:text-pink-600">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 安全的图标组件 ---
    const Icon = ({ name, className }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (className) i.setAttribute('class', className);
          iconRef.current.appendChild(i);
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} style={{ display: 'contents' }}></span>;
    };

    const ADMIN_PASSWORD = 'admin123';

    // --- IndexedDB 安全大容量存储 ---
    const DB_NAME = 'LinMaiCollectorDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'goods';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject('数据库打开失败');
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    };

    const getAllGoodsFromDB = async () => {
      try {
        const db = await initDB();
        return new Promise((resolve) => {
          const transaction = db.transaction(STORE_NAME, 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
        });
      } catch (err) {
        console.error(err);
        return [];
      }
    };

    const saveGoodsToDB = async (goodsList) => {
      try {
        const db = await initDB();
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        store.clear();
        goodsList.forEach(item => store.put(item));
      } catch (err) {
        console.error(err);
      }
    };

    // 图片压缩助手
    const compressImage = (file, maxWidth = 1000, quality = 0.75) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    };

    const DEFAULT_CATEGORIES = [
      { id: 'cat-1', name: '吧唧类目' },
      { id: 'cat-2', name: '明信片类目' },
      { id: 'cat-3', name: '72h类目' },
      { id: 'cat-4', name: '小卡类目' },
      { id: 'cat-5', name: '满赠类目' },
      { id: 'cat-6', name: '特签类目' },
      { id: 'cat-7', name: '线下限定满赠类目' },
    ];

    const DEFAULT_HERO_IMG = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop';
    const DEFAULT_FOOTER_IMG = 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1200&auto=format&fit=crop';

    function App() {
      const [isAdmin, setIsAdmin] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [selectedTag, setSelectedTag] = useState('');

      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('collector_categories');
        return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
      });
      const [heroImage, setHeroImage] = useState(() => {
        return localStorage.getItem('collector_hero_img') || DEFAULT_HERO_IMG;
      });
      const [footerImage, setFooterImage] = useState(() => {
        return localStorage.getItem('collector_footer_img') || DEFAULT_FOOTER_IMG;
      });

      const [activeCatId, setActiveCatId] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [goods, setGoods] = useState([]);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isCatManageOpen, setIsCatManageOpen] = useState(false);
      const [previewItem, setPreviewItem] = useState(null); 
      const [editingGoods, setEditingGoods] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');

      const [formData, setFormData] = useState({
        name: '', categoryId: '', image: '', statusTag: '渡野居', tags: '渡野居', count: 1, note: '', aspectRatio: 'aspect-square'
      });

      useEffect(() => {
        getAllGoodsFromDB().then(async (data) => {
          if (data && data.length > 0) {
            setGoods(data);
          } else {
            try {
              const res = await fetch('./data.json');
              if (res.ok) {
                const remoteData = await res.json();
                if (remoteData.goods) {
                  setGoods(remoteData.goods);
                  saveGoodsToDB(remoteData.goods);
                }
                if (remoteData.categories) setCategories(remoteData.categories);
              }
            } catch (err) {
              console.log('未检测到远程 data.json');
            }
          }
        });
      }, []);

      useEffect(() => {
        localStorage.setItem('collector_categories', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('collector_hero_img', heroImage);
      }, [heroImage]);

      useEffect(() => {
        localStorage.setItem('collector_footer_img', footerImage);
      }, [footerImage]);

      const updateGoodsList = (newList) => {
        setGoods(newList);
        saveGoodsToDB(newList);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === ADMIN_PASSWORD) {
          setIsAdmin(true);
          setShowLoginModal(false);
          setPasswordInput('');
          setIsMenuOpen(false);
        } else {
          alert('密码错误！');
        }
      };

      const exportDataJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
          categories,
          goods,
          heroImage,
          footerImage
        }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importDataJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.goods) updateGoodsList(parsed.goods);
              if (parsed.categories) setCategories(parsed.categories);
              if (parsed.heroImage) setHeroImage(parsed.heroImage);
              if (parsed.footerImage) setFooterImage(parsed.footerImage);
              alert('数据导入成功！');
            } catch (err) {
              alert('数据文件解析格式失败！');
            }
          };
        }
      };

      const moveCategory = (index, direction) => {
        const newCats = [...categories];
        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= newCats.length) return;
        const temp = newCats[index];
        newCats[index] = newCats[targetIndex];
        newCats[targetIndex] = temp;
        setCategories(newCats);
      };

      const renameCategory = (id, newName) => {
        setCategories(categories.map(c => c.id === id ? { ...c, name: newName } : c));
      };

      const addCategory = () => {
        setCategories([...categories, { id: `cat-${Date.now()}`, name: '新类目' }]);
      };

      const deleteCategory = (id) => {
        if (categories.length <= 1) return alert('至少保留一个分类');
        if (confirm('确认删除该分类吗？')) {
          setCategories(categories.filter(c => c.id !== id));
          if (activeCatId === id) setActiveCatId('all');
        }
      };

      const handleGoodsSubmit = (e) => {
        e.preventDefault();
        if (!formData.name) return alert('请输入周边名称');
        let targetCat = formData.categoryId || categories[0]?.id || 'cat-1';

        const formattedTags = formData.tags
          .replace(/，/g, ',')
          .split(',')
          .map(t => t.trim().replace(/^#/, ''))
          .filter(Boolean);

        const payload = {
          ...formData,
          categoryId: targetCat,
          tags: formattedTags,
          aspectRatio: formData.aspectRatio || 'aspect-square'
        };

        if (editingGoods) {
          const updated = goods.map(g => g.id === editingGoods.id ? { ...payload, id: editingGoods.id } : g);
          updateGoodsList(updated);
        } else {
          const newGood = {
            ...payload,
            id: `good-${Date.now()}`,
            createdAt: Date.now()
          };
          updateGoodsList([newGood, ...goods]);
        }
        closeModal();
      };

      const handleDeleteGood = (id, e) => {
        e.stopPropagation();
        if (confirm('确定要删除这个周边记录吗？')) {
          updateGoodsList(goods.filter(g => g.id !== id));
        }
      };

      const openEditModal = (item, e) => {
        e.stopPropagation();
        setEditingGoods(item);
        setFormData({
          name: item.name,
          categoryId: item.categoryId,
          image: item.image,
          statusTag: item.statusTag || '渡野居',
          tags: Array.isArray(item.tags) ? item.tags.join(', ') : (item.tags || ''),
          count: item.count || 1,
          note: item.note || '',
          aspectRatio: item.aspectRatio || 'aspect-square'
        });
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingGoods(null);
        setFormData({ name: '', categoryId: '', image: '', statusTag: '渡野居', tags: '', count: 1, note: '', aspectRatio: 'aspect-square' });
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file);
          setFormData(prev => ({ ...prev, image: compressed }));
        }
      };

      const handleBannerUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file, 1200, 0.8);
          setHeroImage(compressed);
        }
      };

      const handleFooterImageUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file, 1200, 0.8);
          setFooterImage(compressed);
        }
      };

      const filteredGoods = goods.filter(item => {
        const matchesCat = activeCatId === 'all' || item.categoryId === activeCatId;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (item.note && item.note.toLowerCase().includes(searchQuery.toLowerCase()));
        
        const itemTags = Array.isArray(item.tags) ? item.tags : [];
        const matchesSelectedTag = !selectedTag || itemTags.includes(selectedTag);

        return matchesCat && matchesSearch && matchesSelectedTag;
      });

      return (
        <div className="max-w-6xl mx-auto bg-[#fffefb] min-h-screen shadow-xl relative flex flex-col justify-between border-x border-pink-100/50">
          
          <div>
            {/* --- 首页 Banner 区域 --- */}
            <div className="relative h-[32vh] sm:h-[42vh] w-full overflow-hidden bg-slate-900 group rounded-b-[2rem]">
              <img 
                src={heroImage} 
                alt="凛麦图鉴 Banner" 
                className="w-full h-full object-cover opacity-85 group-hover:scale-105 transition-transform duration-700 ease-out"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-slate-950/10 to-transparent"></div>

              <div className="absolute bottom-6 left-6 right-6 flex justify-between items-end">
                <div>
                  <span className="inline-block px-3.5 py-1 bg-pink-300/90 backdrop-blur-md text-pink-900 text-xs font-bold rounded-full mb-2 tracking-wide shadow-sm">
                    IP: 于是麦麦决定离家出走
                  </span>
                  <h1 className="text-3xl sm:text-5xl font-black text-white tracking-tight drop-shadow-md">
                    凛麦图鉴
                  </h1>
                </div>

                {isAdmin && (
                  <label className="cursor-pointer bg-white/30 hover:bg-white/40 backdrop-blur-md text-slate-800 text-xs px-3 py-2 rounded-2xl border border-white/40 transition flex items-center gap-1.5 shadow-sm font-semibold">
                    <Icon name="camera" className="w-4 h-4" />
                    <span className="hidden sm:inline">换顶部图</span>
                    <input type="file" accept="image/*" className="hidden" onChange={handleBannerUpload} />
                  </label>
                )}
              </div>
            </div>

            {/* --- 搜索与筛选控制栏 --- */}
            <div className="sticky top-0 z-30 bg-[#fffefb]/90 backdrop-blur-md border-b border-pink-100/60 p-4 shadow-sm">
              <div className="flex flex-col sm:flex-row gap-4 items-center justify-between">
                
                {/* 猫咪造型搜索框 */}
                <div className="relative w-full sm:w-80 flex items-center my-1">
                  <div className="cat-ear-left"></div>
                  <div className="cat-ear-right"></div>
                  <div className="cat-tail"></div>

                  <div className="relative w-full flex items-center z-10">
                    <Icon name="search" className="w-4 h-4 absolute left-3.5 text-pink-400" />
                    <input 
                      type="text" 
                      placeholder="搜索谷子名称、特点备注..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-10 pr-8 py-2 bg-pink-50/60 border-2 border-pink-200/80 rounded-2xl text-sm text-slate-700 placeholder-pink-300 focus:bg-white focus:border-pink-400 focus:outline-none transition shadow-inner"
                    />
                    {searchQuery && (
                      <button onClick={() => setSearchQuery('')} className="absolute right-3 text-pink-300 hover:text-pink-500">
                        <Icon name="x" className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                </div>

                {/* 激活的标签提示 */}
                {selectedTag && (
                  <div className="flex items-center gap-2 bg-pink-100/80 px-3 py-1 rounded-full border border-pink-300">
                    <span className="text-xs text-pink-700 font-semibold">包含标签: #{selectedTag}</span>
                    <button onClick={() => setSelectedTag('')} className="text-pink-500 hover:text-pink-700">
                      <Icon name="x" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                )}

                {/* 管理员功能操作项 */}
                {isAdmin && (
                  <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button 
                      onClick={() => setIsCatManageOpen(true)}
                      className="flex-1 sm:flex-none px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-2xl transition flex items-center justify-center gap-1.5"
                    >
                      <Icon name="settings-2" className="w-4 h-4" />
                      管理分类
                    </button>

                    <button 
                      onClick={() => setIsModalOpen(true)}
                      className="flex-1 sm:flex-none px-4 py-2 bg-pink-400 hover:bg-pink-500 text-white text-sm font-bold rounded-2xl shadow-md hover:shadow-pink-300/50 transition flex items-center justify-center gap-1.5"
                    >
                      <Icon name="plus" className="w-4 h-4" />
                      上传新谷子
                    </button>
                  </div>
                )}

              </div>

              {/* --- 猫爪造型类目 Tab 栏 --- */}
              <div className="flex items-center gap-2.5 mt-4 overflow-x-auto no-scrollbar pb-1">
                <button
                  onClick={() => setActiveCatId('all')}
                  className={`paw-btn px-4 py-2 text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 shadow-sm active:scale-95 ${
                    activeCatId === 'all'
                      ? 'bg-slate-800 text-white'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  <div className="flex gap-0.5">
                    <span className="paw-toe"></span>
                    <span className="paw-toe"></span>
                    <span className="paw-toe"></span>
                  </div>
                  <span>全部图鉴 ({goods.length})</span>
                </button>

                {categories.map((cat) => {
                  const count = goods.filter(g => g.categoryId === cat.id).length;
                  const isActive = activeCatId === cat.id;
                  return (
                    <button
                      key={cat.id}
                      onClick={() => setActiveCatId(cat.id)}
                      className={`paw-btn px-4 py-2 text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 shadow-sm active:scale-95 ${
                        isActive
                          ? 'bg-pink-300 text-pink-900 border-2 border-pink-400'
                          : 'bg-pink-50/80 text-slate-600 hover:bg-pink-100 border border-pink-100'
                      }`}
                    >
                      <div className="flex gap-0.5">
                        <span className="paw-toe"></span>
                        <span className="paw-toe"></span>
                        <span className="paw-toe"></span>
                      </div>
                      <span>{cat.name}</span>
                      <span className={`px-1.5 py-0.2 text-[10px] rounded-full ${isActive ? 'bg-pink-400 text-white' : 'bg-pink-200/60 text-slate-600'}`}>
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* --- 周边展示卡片网格 --- */}
            <div className="p-4 sm:p-6">
              {filteredGoods.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                  <Icon name="box" className="w-16 h-16 stroke-1 mb-3 text-pink-300" />
                  <p className="text-sm">暂无匹配谷子，{isAdmin ? '快上传新谷吧！' : '等待更新中...'}</p>
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
                  {filteredGoods.map((item) => {
                    const cat = categories.find(c => c.id === item.categoryId);
                    const itemTags = Array.isArray(item.tags) ? item.tags : [];
                    const ratioClass = item.aspectRatio || 'aspect-square';

                    return (
                      <div 
                        key={item.id} 
                        onClick={() => setPreviewItem(item)}
                        className="group bg-white rounded-3xl border border-pink-100/80 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between relative cursor-pointer hover:-translate-y-0.5"
                      >
                        <div className={`relative w-full bg-slate-50 overflow-hidden ${ratioClass === 'aspect-auto' ? 'min-h-[160px] max-h-[300px]' : ratioClass}`}>
                          {item.image ? (
                            <img 
                              src={item.image} 
                              alt={item.name} 
                              className={`w-full h-full group-hover:scale-105 transition duration-300 ${ratioClass === 'aspect-auto' ? 'object-contain' : 'object-cover'}`} 
                            />
                          ) : (
                            <div className="w-full h-full flex items-center justify-center text-slate-300">
                              <Icon name="image" className="w-10 h-10 stroke-1" />
                            </div>
                          )}
                          
                          {/* 持有数量 */}
                          {item.count > 1 && (
                            <span className="absolute top-2 right-2 px-2 py-0.5 bg-slate-800/80 backdrop-blur-md text-white text-[10px] font-extrabold rounded-full">
                              x{item.count}
                            </span>
                          )}

                          {/* 自由编辑角标 */}
                          {item.statusTag && (
                            <span className="absolute top-2 left-2 px-2.5 py-0.5 text-[10px] font-bold rounded-xl backdrop-blur-md bg-emerald-400/90 text-emerald-950 max-w-[80%] truncate shadow-sm">
                              {item.statusTag}
                            </span>
                          )}
                        </div>

                        <div className="p-3 flex flex-col flex-grow justify-between">
                          <div>
                            <div className="text-[10px] text-pink-400 font-bold mb-0.5 truncate">
                              {cat ? cat.name : '未分类'}
                            </div>
                            <h3 className="text-sm font-bold text-slate-800 line-clamp-2 leading-tight mb-2" title={item.name}>
                              {item.name}
                            </h3>

                            {/* 交互 Tag */}
                            {itemTags.length > 0 && (
                              <div className="flex flex-wrap gap-1 mb-2">
                                {itemTags.map((tag, idx) => (
                                  <button
                                    key={idx}
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      setSelectedTag(tag);
                                    }}
                                    className="text-[10px] bg-pink-50 hover:bg-pink-200 hover:text-pink-800 text-pink-600 px-1.5 py-0.5 rounded-lg transition font-medium"
                                  >
                                    #{tag}
                                  </button>
                                ))}
                              </div>
                            )}
                          </div>

                          {isAdmin && (
                            <div className="pt-2 mt-1 border-t border-slate-50 flex items-center justify-between text-slate-400">
                              <button onClick={(e) => openEditModal(item, e)} className="p-1 hover:text-pink-500 transition">
                                <Icon name="edit-3" className="w-3.5 h-3.5" />
                              </button>
                              <button onClick={(e) => handleDeleteGood(item.id, e)} className="p-1 hover:text-red-500 transition">
                                <Icon name="trash-2" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>

          {/* --- 页末图片区域 (全图半高：尺寸高度设为20vh) --- */}
          <div className="mt-8 relative h-[18vh] sm:h-[22vh] w-full overflow-hidden bg-slate-900 group rounded-t-[2rem]">
            <img 
              src={footerImage} 
              alt="页末展示图片" 
              className="w-full h-full object-cover opacity-80"
            />
            <div className="absolute inset-0 bg-slate-950/20"></div>

            {isAdmin && (
              <div className="absolute bottom-3 right-3">
                <label className="cursor-pointer bg-white/80 hover:bg-white backdrop-blur-md text-slate-800 text-xs px-3 py-1.5 rounded-xl border border-white/40 transition flex items-center gap-1.5 font-semibold">
                  <Icon name="camera" className="w-3.5 h-3.5" />
                  <span>更换页末图</span>
                  <input type="file" accept="image/*" className="hidden" onChange={handleFooterImageUpload} />
                </label>
              </div>
            )}
          </div>

          {/* --- 右下角三杠（Hamburger Menu）浮动按钮 --- */}
          <div className="fixed bottom-6 right-6 z-40">
            {isMenuOpen && (
              <div className="absolute bottom-14 right-0 w-48 bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-pink-100 p-2 flex flex-col gap-1 mb-2">
                {isAdmin ? (
                  <>
                    <button 
                      onClick={() => { setIsCatManageOpen(true); setIsMenuOpen(false); }}
                      className="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-pink-50 hover:text-pink-600 rounded-xl transition flex items-center gap-2"
                    >
                      <Icon name="settings-2" className="w-4 h-4" />
                      管理分类
                    </button>
                    <button 
                      onClick={() => { exportDataJSON(); setIsMenuOpen(false); }}
                      className="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-pink-50 hover:text-pink-600 rounded-xl transition flex items-center gap-2"
                    >
                      <Icon name="download" className="w-4 h-4" />
                      导出备份数据(GitHub同步)
                    </button>
                    <label className="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-pink-50 hover:text-pink-600 rounded-xl transition flex items-center gap-2 cursor-pointer">
                      <Icon name="upload" className="w-4 h-4" />
                      导入备份数据
                      <input type="file" accept=".json" className="hidden" onChange={(e) => { importDataJSON(e); setIsMenuOpen(false); }} />
                    </label>
                    <div className="h-px bg-slate-100 my-0.5"></div>
                    <button 
                      onClick={() => { setIsAdmin(false); setIsMenuOpen(false); }}
                      className="w-full text-left px-3 py-2 text-xs font-semibold text-red-500 hover:bg-red-50 rounded-xl transition flex items-center gap-2"
                    >
                      <Icon name="log-out" className="w-4 h-4" />
                      退出管理
                    </button>
                  </>
                ) : (
                  <button 
                    onClick={() => { setShowLoginModal(true); setIsMenuOpen(false); }}
                    className="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-pink-50 hover:text-pink-600 rounded-xl transition flex items-center gap-2"
                  >
                    <Icon name="lock" className="w-4 h-4" />
                    管理登录
                  </button>
                )}
              </div>
            )}

            <button 
              onClick={() => setIsMenuOpen(!isMenuOpen)}
              className="w-12 h-12 bg-pink-400 hover:bg-pink-500 text-white rounded-full shadow-lg hover:shadow-pink-300/50 transition flex items-center justify-center"
            >
              <Icon name={isMenuOpen ? "x" : "menu"} className="w-6 h-6" />
            </button>
          </div>

          {/* --- 管理登录弹窗 --- */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleAdminLogin} className="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl relative border border-pink-100">
                <h3 className="text-base font-bold text-slate-800 mb-3 text-center">管理登录</h3>
                <input 
                  type="password"
                  placeholder="请输入密匙"
                  value={passwordInput}
                  onChange={(e) => setPasswordInput(e.target.value)}
                  className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm mb-4 focus:outline-none focus:border-pink-400"
                />
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowLoginModal(false)} className="flex-1 py-2 bg-slate-100 text-slate-600 text-xs font-semibold rounded-2xl">取消</button>
                  <button type="submit" className="flex-1 py-2 bg-pink-400 text-white text-xs font-semibold rounded-2xl shadow-md">确认登录</button>
                </div>
              </form>
            </div>
          )}

          {/* --- 谷子详情/预览弹窗 --- */}
          {previewItem && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer" onClick={() => setPreviewItem(null)}>
              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl cursor-default" onClick={(e) => e.stopPropagation()}>
                <div className="relative max-h-[60vh] bg-slate-100 flex items-center justify-center">
                  <img src={previewItem.image} alt={previewItem.name} className="max-h-[60vh] w-full object-contain" />
                  <button onClick={() => setPreviewItem(null)} className="absolute top-3 right-3 p-1.5 bg-black/50 text-white rounded-full hover:bg-black/70 flex items-center justify-center">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-5">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-xs text-pink-500 font-bold">{categories.find(c => c.id === previewItem.categoryId)?.name || '未分类'}</span>
                    {previewItem.statusTag && (
                      <span className="text-[10px] bg-emerald-400 text-emerald-950 px-2 py-0.5 rounded-md font-bold">
                        {previewItem.statusTag}
                      </span>
                    )}
                  </div>
                  <h2 className="text-lg font-bold text-slate-800 mb-2">{previewItem.name}</h2>
                  
                  {/* 标签列表 */}
                  {Array.isArray(previewItem.tags) && previewItem.tags.length > 0 && (
                    <div className="flex flex-wrap gap-1 mb-3">
                      {previewItem.tags.map((t, idx) => (
                        <span key={idx} className="text-xs bg-pink-50 text-pink-700 px-2 py-0.5 rounded-md font-medium">
                          #{t}
                        </span>
                      ))}
                    </div>
                  )}

                  {previewItem.note && (
                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs text-slate-600 leading-relaxed">
                      {previewItem.note}
                    </div>
                  )}
                  <div className="mt-4 flex justify-between items-center text-xs text-slate-400">
                    <span>持有数量：{previewItem.count} 个</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* --- 管理分类弹窗 --- */}
          {isCatManageOpen && isAdmin && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl relative border border-pink-100">
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                  <h2 className="text-base font-bold text-slate-800">修改与排序类目</h2>
                  <button onClick={() => setIsCatManageOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-2.5 max-h-[50vh] overflow-y-auto no-scrollbar pr-1 mb-4">
                  {categories.map((cat, index) => (
                    <div key={cat.id} className="flex items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
                      <div className="flex flex-col gap-0.5">
                        <button disabled={index === 0} onClick={() => moveCategory(index, 'up')} className="p-0.5 text-slate-400 hover:text-pink-500 disabled:opacity-20 flex"><Icon name="chevron-up" className="w-3.5 h-3.5" /></button>
                        <button disabled={index === categories.length - 1} onClick={() => moveCategory(index, 'down')} className="p-0.5 text-slate-400 hover:text-pink-500 disabled:opacity-20 flex"><Icon name="chevron-down" className="w-3.5 h-3.5" /></button>
                      </div>
                      <input type="text" value={cat.name} onChange={(e) => renameCategory(cat.id, e.target.value)} className="flex-grow bg-white border border-slate-200 px-3 py-1.5 rounded-xl text-sm text-slate-700 font-medium" />
                      <button onClick={() => deleteCategory(cat.id)} className="p-1.5 text-slate-400 hover:text-red-500 transition flex"><Icon name="trash-2" className="w-4 h-4" /></button>
                    </div>
                  ))}
                </div>

                <button onClick={addCategory} className="w-full py-2.5 border-2 border-dashed border-pink-200 text-pink-500 hover:bg-pink-50 text-sm font-bold rounded-2xl transition flex items-center justify-center gap-1.5">
                  <Icon name="plus-circle" className="w-4 h-4" />
                  添加新类目
                </button>
              </div>
            </div>
          )}

          {/* --- 新增/修改谷子弹窗 --- */}
          {isModalOpen && isAdmin && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto border border-pink-100">
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                  <h2 className="text-base font-bold text-slate-800">{editingGoods ? '修改谷子信息' : '上传新谷子'}</h2>
                  <button onClick={closeModal} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
                </div>

                <form onSubmit={handleGoodsSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">谷子实物图/官图</label>
                    <div className="flex items-center gap-4">
                      <div className="w-20 h-20 bg-slate-100 rounded-2xl overflow-hidden flex items-center justify-center border border-slate-200 shrink-0">
                        {formData.image ? <img src={formData.image} className="w-full h-full object-cover" /> : <Icon name="image" className="w-6 h-6 text-slate-300" />}
                      </div>
                      <label className="cursor-pointer bg-pink-50 hover:bg-pink-100 text-pink-700 text-xs font-semibold px-4 py-2.5 rounded-2xl transition flex items-center gap-2 border border-pink-200">
                        <Icon name="upload" className="w-4 h-4" />
                        上传图片 (自动处理压缩)
                        <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                      </label>
                    </div>
                  </div>

                  {/* 1. 图片展示比例自由设置 */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">图片展示比例 (由管理员自由选择)</label>
                    <select 
                      value={formData.aspectRatio} 
                      onChange={(e) => setFormData({ ...formData, aspectRatio: e.target.value })}
                      className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm font-medium"
                    >
                      <option value="aspect-square">1 : 1 正方形 (推荐：吧唧/色纸)</option>
                      <option value="aspect-[3/4]">3 : 4 纵向长方形 (推荐：立牌/明信片/小卡)</option>
                      <option value="aspect-[4/3]">4 : 3 横向长方形 (推荐：横向色纸/海报)</option>
                      <option value="aspect-auto">完整适应（不裁切全图显示）</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">谷子名称 *</label>
                    <input type="text" required placeholder="如：凛麦特签预售吧唧" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5">所属分类</label>
                      <select value={formData.categoryId || categories[0]?.id} onChange={(e) => setFormData({ ...formData, categoryId: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm">
                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5">持有数量</label>
                      <input type="number" min="1" value={formData.count} onChange={(e) => setFormData({ ...formData, count: parseInt(e.target.value) || 1 })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">左上角绿色角标文字 (店铺/状态)</label>
                    <input type="text" placeholder="如：渡野居、求购中、已到货" value={formData.statusTag} onChange={(e) => setFormData({ ...formData, statusTag: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">谷子标签 (用逗号分隔，点击标签可自动过滤筛选)</label>
                    <input type="text" placeholder="如：渡野居, 预售, 72h" value={formData.tags} onChange={(e) => setFormData({ ...formData, tags: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">详细备注/工艺等</label>
                    <textarea rows="2" placeholder="如：流沙工艺、限量特签..." value={formData.note} onChange={(e) => setFormData({ ...formData, note: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm"></textarea>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={closeModal} className="px-4 py-2 bg-slate-100 text-slate-600 text-sm font-medium rounded-2xl">取消</button>
                    <button type="submit" className="px-5 py-2 bg-pink-400 text-white text-sm font-semibold rounded-2xl shadow-md">保存收录</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
