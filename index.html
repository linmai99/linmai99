<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小猫人档案馆 - 于是麦麦决定离家出走</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Cursive Font for LinMai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .font-linmai {
      font-family: 'Great Vibes', cursive, sans-serif;
    }

    /* 猫耳朵与猫尾巴自定义样式 */
    .cat-ear-left {
      position: absolute;
      top: -8px;
      left: 18px;
      width: 16px;
      height: 14px;
      background-color: #fbcfe8;
      border-top-left-radius: 12px;
      border-top-right-radius: 4px;
      transform: rotate(-15deg);
      border: 2px solid #f472b6;
      border-bottom: none;
    }
    .cat-ear-right {
      position: absolute;
      top: -8px;
      right: 18px;
      width: 16px;
      height: 14px;
      background-color: #fbcfe8;
      border-top-left-radius: 4px;
      border-top-right-radius: 12px;
      transform: rotate(15deg);
      border: 2px solid #f472b6;
      border-bottom: none;
    }
    .cat-tail {
      position: absolute;
      right: -12px;
      bottom: 8px;
      width: 22px;
      height: 12px;
      border-right: 4px solid #f472b6;
      border-bottom: 4px solid #f472b6;
      border-bottom-right-radius: 12px;
      transform: rotate(-10deg);
    }

    /* 猫爪按钮 */
    .paw-btn {
      position: relative;
      padding-top: 8px;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }
    .paw-toe {
      width: 6px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
      display: inline-block;
      opacity: 0.6;
    }

    /* 3D 旋转 Perspective */
    .perspective-container {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
      transition: transform 0.05s ease-out;
    }

    /* 3D 亚克力立牌光泽特效 */
    .acrylic-standee {
      filter: drop-shadow(0px 10px 12px rgba(0,0,0,0.15));
      position: relative;
    }
  </style>
</head>
<body class="bg-[#fdfbf7] text-slate-700 min-h-screen pb-12 antialiased selection:bg-pink-100 selection:text-pink-600">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, className }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (className) i.setAttribute('class', className);
          iconRef.current.appendChild(i);
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} style={{ display: 'contents' }}></span>;
    };

    const ADMIN_PASSWORD = 'admin123';
    const DB_NAME = 'LinMaiCollectorDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'goods';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject('数据库打开失败');
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    };

    const getAllGoodsFromDB = async () => {
      try {
        const db = await initDB();
        return new Promise((resolve) => {
          const transaction = db.transaction(STORE_NAME, 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
        });
      } catch (err) {
        return [];
      }
    };

    const saveGoodsToDB = async (goodsList) => {
      try {
        const db = await initDB();
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        store.clear();
        goodsList.forEach(item => store.put(item));
      } catch (err) {}
    };

    const compressImage = (file, maxWidth = 1000, quality = 0.85) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            resolve(canvas.toDataURL(mimeType, quality));
          };
        };
      });
    };

    // --- 可拖拽缩放的图片调整组件 ---
    const AdjustContainerImage = ({ src, alt, transformData, onSaveTransform, isAdmin, className }) => {
      const [pos, setPos] = useState(transformData?.pos || { x: 0, y: 0 });
      const [scale, setScale] = useState(transformData?.scale || 1);
      const [isDragging, setIsDragging] = useState(false);
      const startRef = useRef({ x: 0, y: 0 });

      useEffect(() => {
        if (transformData) {
          setPos(transformData.pos || { x: 0, y: 0 });
          setScale(transformData.scale || 1);
        }
      }, [transformData]);

      const handleMouseDown = (e) => {
        if (!isAdmin) return;
        setIsDragging(true);
        startRef.current = { x: e.clientX - pos.x, y: e.clientY - pos.y };
      };

      const handleMouseMove = (e) => {
        if (!isDragging || !isAdmin) return;
        setPos({ x: e.clientX - startRef.current.x, y: e.clientY - startRef.current.y });
      };

      const handleMouseUp = () => {
        if (isDragging && isAdmin) {
          setIsDragging(false);
          if (onSaveTransform) onSaveTransform({ pos, scale });
        }
      };

      const handleWheel = (e) => {
        if (!isAdmin) return;
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.05 : -0.05;
        const newScale = Math.min(Math.max(0.5, scale + delta), 3);
        setScale(newScale);
        if (onSaveTransform) onSaveTransform({ pos, scale: newScale });
      };

      return (
        <div 
          className={`relative w-full h-full overflow-hidden ${isAdmin ? 'cursor-grab active:cursor-grabbing' : ''}`}
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
          onWheel={handleWheel}
        >
          <img 
            src={src} 
            alt={alt} 
            className={className}
            style={{
              transform: `translate(${pos.x}px, ${pos.y}px) scale(${scale})`,
              transition: isDragging ? 'none' : 'transform 0.1s ease-out'
            }}
            draggable={false}
          />
          {isAdmin && (
            <div className="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-full pointer-events-none opacity-0 hover:opacity-100 transition">
              按住拖动 / 滚轮缩放
            </div>
          )}
        </div>
      );
    };

    // --- 可交互 3D 图片渲染组件 ---
    const ThreeDImageCard = ({ src, alt, enable3D, isStandee, className, priceText, priceColor, priceSize, priceItalic, children }) => {
      const [rotation, setRotation] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const startPos = useRef({ x: 0, y: 0 });

      const renderPriceBadge = () => {
        if (!priceText) return null;
        return (
          <div 
            className={`absolute bottom-2 right-2 font-black drop-shadow-md px-2 py-0.5 rounded-md backdrop-blur-[3px] bg-white/40 z-20 pointer-events-none ${priceSize || 'text-sm'} ${priceItalic ? 'italic' : ''}`}
            style={{ color: priceColor || '#f43f5e' }}
          >
            {priceText}
          </div>
        );
      };

      if (!enable3D) {
        return (
          <div className="relative w-full h-full flex items-center justify-center">
            <img src={src} alt={alt} className={className} />
            {renderPriceBadge()}
            {children}
          </div>
        );
      }

      const handleMouseDown = (e) => {
        e.stopPropagation();
        setIsDragging(true);
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startPos.current = { x: clientX - rotation.y, y: clientY + rotation.x };
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        e.stopPropagation();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let rotY = clientX - startPos.current.x;
        let rotX = startPos.current.y - clientY;

        rotX = Math.max(-60, Math.min(60, rotX));
        rotY = Math.max(-75, Math.min(75, rotY));

        setRotation({ x: rotX, y: rotY });
      };

      const handleMouseUp = (e) => {
        if (isDragging) {
          e.stopPropagation();
          setIsDragging(false);
        }
      };

      return (
        <div 
          className="perspective-container relative w-full h-full flex flex-col items-center justify-center cursor-grab active:cursor-grabbing select-none"
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
          onTouchStart={handleMouseDown}
          onTouchMove={handleMouseMove}
          onTouchEnd={handleMouseUp}
        >
          <div 
            className="preserve-3d w-full h-full flex flex-col items-center justify-center relative transition-transform duration-75"
            style={{ 
              transform: `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`,
              filter: `drop-shadow(${rotation.y * -0.2}px ${rotation.x * 0.2 + 8}px 12px rgba(0,0,0,0.12))`
            }}
          >
            <img src={src} alt={alt} className={`${className} pointer-events-none`} />

            {isStandee && (
              <div className="w-36 h-7 -mt-4 bg-white/60 rounded-[50%] border-2 border-pink-300/80 shadow-[0_6px_15px_rgba(244,114,182,0.3)] backdrop-blur-md transform rotateX-60 flex items-center justify-center shrink-0">
                <div className="w-16 h-2 bg-pink-400/80 rounded-full shadow-inner"></div>
              </div>
            )}

            {children}
          </div>

          {renderPriceBadge()}

          {(rotation.x !== 0 || rotation.y !== 0) && (
            <button 
              onClick={(e) => { e.stopPropagation(); setRotation({ x: 0, y: 0 }); }}
              className="absolute top-2 right-2 z-20 bg-pink-500 hover:bg-pink-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-full shadow-md"
            >
              重置视角
            </button>
          )}
        </div>
      );
    };

    const DEFAULT_CATEGORIES = [
      { id: 'cat-1', name: '吧唧类目' },
      { id: 'cat-2', name: '明信片类目' },
      { id: 'cat-3', name: '72h类目' },
      { id: 'cat-4', name: '小卡类目' },
      { id: 'cat-5', name: '满赠类目' },
      { id: 'cat-6', name: '特签类目' },
      { id: 'cat-7', name: '线下限定满赠类目' },
    ];

    const DEFAULT_HERO_IMG = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop';
    const DEFAULT_FOOTER_IMG = 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1200&auto=format&fit=crop';

    function App() {
      const [isAdmin, setIsAdmin] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [selectedTag, setSelectedTag] = useState('');

      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('collector_categories');
        return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
      });

      const [heroImage, setHeroImage] = useState(() => localStorage.getItem('collector_hero_img') || DEFAULT_HERO_IMG);
      const [heroTransform, setHeroTransform] = useState(() => {
        const saved = localStorage.getItem('collector_hero_tf');
        return saved ? JSON.parse(saved) : { pos: { x: 0, y: 0 }, scale: 1 };
      });

      const [footerImage, setFooterImage] = useState(() => localStorage.getItem('collector_footer_img') || DEFAULT_FOOTER_IMG);
      const [footerTransform, setFooterTransform] = useState(() => {
        const saved = localStorage.getItem('collector_footer_tf');
        return saved ? JSON.parse(saved) : { pos: { x: 0, y: 0 }, scale: 1 };
      });

      const [activeCatId, setActiveCatId] = useState('all');
      const [searchInput, setSearchInput] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortOrder, setSortOrder] = useState('newest'); 

      const [goods, setGoods] = useState([]);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isCatManageOpen, setIsCatManageOpen] = useState(false);
      const [previewItem, setPreviewItem] = useState(null); 
      const [previewImgIdx, setPreviewImgIdx] = useState(0);

      const [editingGoods, setEditingGoods] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');

      // 彩蛋区
      const [isEggOpen, setIsEggOpen] = useState(false);
      const [standeeImages, setStandeeImages] = useState(() => {
        const saved = localStorage.getItem('collector_standees');
        return saved ? JSON.parse(saved) : [];
      });

      // 表单数据
      const [formData, setFormData] = useState({
        name: '', categoryId: '', images: [], statusTag: '', tags: '', count: 1, note: '', 
        aspectRatio: 'aspect-square',
        enable3D: false,
        priceText: '',
        priceColor: '#f43f5e',
        priceSize: 'text-sm',
        priceItalic: false,
        sizeInfo: ''
      });

      useEffect(() => {
        getAllGoodsFromDB().then(async (data) => {
          if (data && data.length > 0) {
            // 数据结构平滑适配：支持旧的 item.image 兼容为 item.images
            const normalized = data.map(g => ({
              ...g,
              images: (g.images && g.images.length > 0) ? g.images : (g.image ? [g.image] : [])
            }));
            setGoods(normalized);
          } else {
            try {
              const res = await fetch('./data.json');
              if (res.ok) {
                const remoteData = await res.json();
                if (remoteData.goods) {
                  const normalized = remoteData.goods.map(g => ({
                    ...g,
                    images: (g.images && g.images.length > 0) ? g.images : (g.image ? [g.image] : [])
                  }));
                  setGoods(normalized);
                  saveGoodsToDB(normalized);
                }
                if (remoteData.categories) setCategories(remoteData.categories);
              }
            } catch (err) {}
          }
        });
      }, []);

      useEffect(() => localStorage.setItem('collector_categories', JSON.stringify(categories)), [categories]);
      useEffect(() => localStorage.setItem('collector_hero_img', heroImage), [heroImage]);
      useEffect(() => localStorage.setItem('collector_hero_tf', JSON.stringify(heroTransform)), [heroTransform]);
      useEffect(() => localStorage.setItem('collector_footer_img', footerImage), [footerImage]);
      useEffect(() => localStorage.setItem('collector_footer_tf', JSON.stringify(footerTransform)), [footerTransform]);
      useEffect(() => localStorage.setItem('collector_standees', JSON.stringify(standeeImages)), [standeeImages]);

      const updateGoodsList = (newList) => {
        setGoods(newList);
        saveGoodsToDB(newList);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === ADMIN_PASSWORD) {
          setIsAdmin(true);
          setShowLoginModal(false);
          setPasswordInput('');
          setIsMenuOpen(false);
        } else {
          alert('密码错误！');
        }
      };

      const exportDataJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
          categories, goods, heroImage, heroTransform, footerImage, footerTransform, standeeImages
        }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importDataJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.goods) updateGoodsList(parsed.goods);
              if (parsed.categories) setCategories(parsed.categories);
              if (parsed.heroImage) setHeroImage(parsed.heroImage);
              if (parsed.footerImage) setFooterImage(parsed.footerImage);
              if (parsed.standeeImages) setStandeeImages(parsed.standeeImages);
              alert('数据导入成功！');
            } catch (err) {
              alert('数据文件解析格式失败！');
            }
          };
        }
      };

      const moveCategory = (index, direction) => {
        const newCats = [...categories];
        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= newCats.length) return;
        const temp = newCats[index];
        newCats[index] = newCats[targetIndex];
        newCats[targetIndex] = temp;
        setCategories(newCats);
      };

      const handleGoodsSubmit = (e) => {
        e.preventDefault();
        if (!formData.name) return alert('请输入周边名称');
        let targetCat = formData.categoryId || categories[0]?.id || 'cat-1';

        const formattedTags = formData.tags
          .replace(/，/g, ',')
          .split(',')
          .map(t => t.trim().replace(/^#/, ''))
          .filter(Boolean);

        const payload = {
          ...formData,
          image: formData.images[0] || '', // 保留兼容字段为封面图
          categoryId: targetCat,
          tags: formattedTags,
          createdAt: editingGoods?.createdAt || Date.now()
        };

        if (editingGoods) {
          const updated = goods.map(g => g.id === editingGoods.id ? { ...payload, id: editingGoods.id } : g);
          updateGoodsList(updated);
        } else {
          const newGood = { ...payload, id: `good-${Date.now()}` };
          updateGoodsList([newGood, ...goods]);
        }
        closeModal();
      };

      const handleDeleteGood = (id, e) => {
        e.stopPropagation();
        if (confirm('确定要删除这个周边记录吗？')) {
          updateGoodsList(goods.filter(g => g.id !== id));
        }
      };

      const openEditModal = (item, e) => {
        e.stopPropagation();
        setEditingGoods(item);
        const itemImgs = (item.images && item.images.length > 0) ? item.images : (item.image ? [item.image] : []);
        
        setFormData({
          name: item.name,
          categoryId: item.categoryId,
          images: itemImgs,
          statusTag: item.statusTag || '',
          tags: Array.isArray(item.tags) ? item.tags.join(', ') : (item.tags || ''),
          count: item.count || 1,
          note: item.note || '',
          aspectRatio: item.aspectRatio || 'aspect-square',
          enable3D: !!item.enable3D,
          priceText: item.priceText || '',
          priceColor: item.priceColor || '#f43f5e',
          priceSize: item.priceSize || 'text-sm',
          priceItalic: !!item.priceItalic,
          sizeInfo: item.sizeInfo || ''
        });
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingGoods(null);
        setFormData({ 
          name: '', categoryId: '', images: [], statusTag: '', tags: '', count: 1, note: '', 
          aspectRatio: 'aspect-square', enable3D: false, priceText: '', priceColor: '#f43f5e', priceSize: 'text-sm', priceItalic: false, sizeInfo: '' 
        });
      };

      // 多图批量/追加上传处理 + 自动设为“有实物图”
      const handleMultiImageUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const compressedList = await Promise.all(files.map(f => compressImage(f)));
        const newImages = [...formData.images, ...compressedList];

        setFormData(prev => ({
          ...prev,
          images: newImages,
          // 当图片数量 >= 2 时，自动填充为“有实物图”
          statusTag: newImages.length >= 2 ? (prev.statusTag || '有实物图') : prev.statusTag
        }));
      };

      const removeFormImage = (idx) => {
        const updatedImgs = formData.images.filter((_, i) => i !== idx);
        setFormData(prev => ({
          ...prev,
          images: updatedImgs
        }));
      };

      const handleStandeeUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file, 800, 0.9);
          setStandeeImages(prev => [compressed, ...prev]);
        }
      };

      const handleSearchSubmit = () => {
        setSearchQuery(searchInput.trim());
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          handleSearchSubmit();
        }
      };

      const filteredGoods = goods
        .filter(item => {
          const matchesCat = activeCatId === 'all' || item.categoryId === activeCatId;
          const cleanSearch = searchQuery.replace(/^#/, '').toLowerCase();

          const itemTags = Array.isArray(item.tags) ? item.tags : [];
          const matchesTags = itemTags.some(t => t.toLowerCase().includes(cleanSearch));
          const matchesSearch = !cleanSearch || 
                                item.name.toLowerCase().includes(cleanSearch) || 
                                (item.note && item.note.toLowerCase().includes(cleanSearch)) ||
                                (item.sizeInfo && item.sizeInfo.toLowerCase().includes(cleanSearch)) ||
                                matchesTags;
          
          const matchesSelectedTag = !selectedTag || itemTags.includes(selectedTag);

          return matchesCat && matchesSearch && matchesSelectedTag;
        })
        .sort((a, b) => {
          const timeA = a.createdAt || 0;
          const timeB = b.createdAt || 0;
          return sortOrder === 'newest' ? timeB - timeA : timeA - timeB;
        });

      return (

                      )}
                      {previewItem.statusTag && (
                        <span className="text-[10px] bg-emerald-400 text-emerald-950 px-2 py-0.5 rounded-md font-bold">
                          {previewItem.statusTag}
                        </span>
                      )}
                    </div>
                    <h2 className="text-base font-bold text-slate-800 mb-2">{previewItem.name}</h2>
                    
                    {Array.isArray(previewItem.tags) && previewItem.tags.length > 0 && (
                      <div className="flex flex-wrap gap-1 mb-3">
                        {previewItem.tags.map((t, idx) => (
                          <span key={idx} className="text-xs bg-pink-50 text-pink-700 px-2 py-0.5 rounded-md font-medium">
                            #{t}
                          </span>
                        ))}
                      </div>
                    )}

                    {previewItem.note && (
                      <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs text-slate-600 leading-relaxed">
                        {previewItem.note}
                      </div>
                    )}
                    <div className="mt-4 flex justify-between items-center text-xs text-slate-400">
                      <span>持有数量：{previewItem.count} 个</span>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* --- 管理分类弹窗 --- */}
          {isCatManageOpen && isAdmin && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl relative border border-pink-100">
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                  <h2 className="text-base font-bold text-slate-800">修改与排序类目</h2>
                  <button onClick={() => setIsCatManageOpen(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <div className="space-y-2.5 max-h-[50vh] overflow-y-auto no-scrollbar pr-1 mb-4">
                  {categories.map((cat, index) => (
                    <div key={cat.id} className="flex items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
                      <div className="flex flex-col gap-0.5">
                        <button disabled={index === 0} onClick={() => moveCategory(index, 'up')} className="p-0.5 text-slate-400 hover:text-pink-500 disabled:opacity-20 flex"><Icon name="chevron-up" className="w-3.5 h-3.5" /></button>
                        <button disabled={index === categories.length - 1} onClick={() => moveCategory(index, 'down')} className="p-0.5 text-slate-400 hover:text-pink-500 disabled:opacity-20 flex"><Icon name="chevron-down" className="w-3.5 h-3.5" /></button>
                      </div>
                      <input type="text" value={cat.name} onChange={(e) => setCategories(categories.map(c => c.id === cat.id ? { ...c, name: e.target.value } : c))} className="flex-grow bg-white border border-slate-200 px-3 py-1.5 rounded-xl text-sm text-slate-700 font-medium" />
                      <button onClick={() => setCategories(categories.filter(c => c.id !== cat.id))} className="p-1.5 text-slate-400 hover:text-red-500 transition flex"><Icon name="trash-2" className="w-4 h-4" /></button>
                    </div>
                  ))}
                </div>
                <button onClick={() => setCategories([...categories, { id: `cat-${Date.now()}`, name: '新类目' }])} className="w-full py-2.5 border-2 border-dashed border-pink-200 text-pink-500 hover:bg-pink-50 text-sm font-bold rounded-2xl transition flex items-center justify-center gap-1.5">
                  <Icon name="plus-circle" className="w-4 h-4" />
                  添加新类目
                </button>
              </div>
            </div>
          )}

          {/* --- 新增/修改周边弹窗（支持多图管理与自动置为有实物图） --- */}
          {isModalOpen && isAdmin && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto border border-pink-100">
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                  <h2 className="text-base font-bold text-slate-800">{editingGoods ? '修改周边信息' : '上传新周边'}</h2>
                  <button onClick={closeModal} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
                </div>

                <form onSubmit={handleGoodsSubmit} className="space-y-4">
                  
                  {/* 多图上传区 */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">
                      实物图 / 官图 (第一张默认为封面)
                    </label>
                    <div className="flex flex-wrap gap-2.5 items-center">
                      {formData.images.map((imgSrc, idx) => (
                        <div key={idx} className="relative w-16 h-16 bg-slate-100 rounded-2xl overflow-hidden border border-slate-200 shrink-0 group">
                          <img src={imgSrc} className="w-full h-full object-cover" />
                          {idx === 0 && (
                            <span className="absolute bottom-0 inset-x-0 bg-pink-500 text-white text-[8px] font-bold text-center py-0.5">
                              封面
                            </span>
                          )}
                          <button
                            type="button"
                            onClick={() => removeFormImage(idx)}
                            className="absolute top-1 right-1 bg-black/60 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition"
                          >
                            <Icon name="x" className="w-3 h-3" />
                          </button>
                        </div>
                      ))}

                      <label className="cursor-pointer w-16 h-16 bg-pink-50 hover:bg-pink-100 text-pink-500 rounded-2xl border-2 border-dashed border-pink-200 flex flex-col items-center justify-center transition shrink-0">
                        <Icon name="plus" className="w-5 h-5" />
                        <span className="text-[9px] font-bold mt-0.5">多选上传</span>
                        <input type="file" accept="image/*" multiple onChange={handleMultiImageUpload} className="hidden" />
                      </label>
                    </div>
                  </div>

                  <div className="flex items-center justify-between bg-pink-50/50 p-3 rounded-2xl border border-pink-100">
                    <div>
                      <span className="text-xs font-bold text-slate-700 block">开启 3D 旋转视角</span>
                      <span className="text-[10px] text-slate-400 block">按拽图片可自由旋转 3D 视角</span>
                    </div>
                    <label className="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" checked={formData.enable3D} onChange={(e) => setFormData({ ...formData, enable3D: e.target.checked })} className="sr-only peer" />
                      <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-pink-400"></div>
                    </label>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">图片展示比例</label>
                    <select value={formData.aspectRatio} onChange={(e) => setFormData({ ...formData, aspectRatio: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm font-medium">
                      <option value="aspect-square">1 : 1 正方形 (吧唧/色纸)</option>
                      <option value="aspect-[3/4]">3 : 4 纵向长方形 (立牌/明信片/小卡)</option>
                      <option value="aspect-[4/3]">4 : 3 横向长方形 (海报/画幅)</option>
                      <option value="aspect-auto">完整适应（原图排版全图显示）</option>
                    </select>
                  </div>

                  <div className="p-3 bg-slate-50 border border-slate-100 rounded-2xl space-y-3">
                    <label className="block text-xs font-bold text-slate-700">图片右下角标（价格/标识文本）</label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <input type="text" placeholder="如：￥25" value={formData.priceText} onChange={(e) => setFormData({ ...formData, priceText: e.target.value })} className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs" />
                      
                      <select value={formData.priceSize} onChange={(e) => setFormData({ ...formData, priceSize: e.target.value })} className="px-2 py-1.5 bg-white border border-slate-200 rounded-xl text-xs">
                        <option value="text-xs">字号: 小</option>
                        <option value="text-sm">字号: 中</option>
                        <option value="text-base">字号: 大</option>
                        <option value="text-lg">字号: 特大</option>
                        <option value="text-xl">字号: 超大 2XL</option>
                        <option value="text-2xl">字号: 巨型 3XL</option>
                      </select>
                    </div>

                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2 bg-white px-3 py-1.5 border border-slate-200 rounded-xl flex-grow">
                        <span className="text-xs text-slate-500 whitespace-nowrap">颜色色盘:</span>
                        <input type="color" value={formData.priceColor} onChange={(e) => setFormData({ ...formData, priceColor: e.target.value })} className="w-6 h-6 rounded-lg cursor-pointer border-0 bg-transparent" />
                      </div>

                      <label className="flex items-center gap-1.5 bg-white px-3 py-1.5 border border-slate-200 rounded-xl cursor-pointer">
                        <input type="checkbox" checked={formData.priceItalic} onChange={(e) => setFormData({ ...formData, priceItalic: e.target.checked })} className="rounded text-pink-500 focus:ring-0" />
                        <span className="text-xs font-bold italic text-slate-700">斜体效果</span>
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">周边名称 *</label>
                    <input type="text" required placeholder="如：凛麦特签预售吧唧" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5">所属分类</label>
                      <select value={formData.categoryId || categories[0]?.id} onChange={(e) => setFormData({ ...formData, categoryId: e.target.value })} className="w-full px-3 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-xs">
                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5">尺寸项 (可选)</label>
                      <input type="text" placeholder="如: 58mm" value={formData.sizeInfo} onChange={(e) => setFormData({ ...formData, sizeInfo: e.target.value })} className="w-full px-3 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-xs" />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5">持有数量</label>
                      <input type="number" min="1" value={formData.count} onChange={(e) => setFormData({ ...formData, count: parseInt(e.target.value) || 1 })} className="w-full px-3 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-xs" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">左上角角标文字 (多图自动填充为“有实物图”)</label>
                    <input type="text" placeholder="如：有实物图、渡野居、求购中" value={formData.statusTag} onChange={(e) => setFormData({ ...formData, statusTag: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">标签 (用逗号分隔)</label>
                    <input type="text" placeholder="如：渡野居, 预售, 72h" value={formData.tags} onChange={(e) => setFormData({ ...formData, tags: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">详细备注/工艺</label>
                    <textarea rows="2" placeholder="如：流沙工艺..." value={formData.note} onChange={(e) => setFormData({ ...formData, note: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm"></textarea>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={closeModal} className="px-4 py-2 bg-slate-100 text-slate-600 text-sm font-medium rounded-2xl">取消</button>
                    <button type="submit" className="px-5 py-2 bg-pink-400 text-white text-sm font-semibold rounded-2xl shadow-md">保存收录</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
