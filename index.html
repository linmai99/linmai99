<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>凛麦图鉴 - 于是麦麦决定离家出走</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 猫耳朵与猫尾巴自定义样式 */
    .cat-ear-left {
      position: absolute;
      top: -8px;
      left: 18px;
      width: 16px;
      height: 14px;
      background-color: #fbcfe8;
      border-top-left-radius: 12px;
      border-top-right-radius: 4px;
      transform: rotate(-15deg);
      border: 2px solid #f472b6;
      border-bottom: none;
    }
    .cat-ear-right {
      position: absolute;
      top: -8px;
      right: 18px;
      width: 16px;
      height: 14px;
      background-color: #fbcfe8;
      border-top-left-radius: 4px;
      border-top-right-radius: 12px;
      transform: rotate(15deg);
      border: 2px solid #f472b6;
      border-bottom: none;
    }
    .cat-tail {
      position: absolute;
      right: -12px;
      bottom: 8px;
      width: 22px;
      height: 12px;
      border-right: 4px solid #f472b6;
      border-bottom: 4px solid #f472b6;
      border-bottom-right-radius: 12px;
      transform: rotate(-10deg);
    }

    /* 猫爪按钮 */
    .paw-btn {
      position: relative;
      padding-top: 8px;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }
    .paw-toe {
      width: 6px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
      display: inline-block;
      opacity: 0.6;
    }

    /* 首图圆润猫头 Clip-Path 形状 */
    .cat-head-shape {
      clip-path: path('M 0,90 Q 0,40 50,20 Q 90,0 120,40 Q 180,40 220,40 Q 250,0 290,20 Q 340,40 340,90 Q 340,180 170,220 Q 0,180 0,90 Z');
    }

    /* 两只睡猫页尾 Clip-Path 剪裁 */
    .sleeping-cats-shape {
      clip-path: polygon(
        0% 100%, 0% 35%, 10% 20%, 18% 10%, 25% 25%, 35% 15%, 45% 25%, 
        50% 20%, 55% 25%, 65% 15%, 75% 25%, 82% 10%, 90% 20%, 100% 35%, 100% 100%
      );
    }

    /* 3D 旋转 Perspective */
    .perspective-container {
      perspective: 900px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
      transition: transform 0.08s ease-out;
    }

    /* 3D 亚克力立牌光泽特效 */
    .acrylic-standee {
      filter: drop-shadow(0px 12px 10px rgba(0,0,0,0.25));
      position: relative;
    }
    .acrylic-standee::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.3) 100%);
      pointer-events: none;
      box-shadow: 0 0 10px rgba(255,255,255,0.8) inset;
    }
  </style>
</head>
<body class="bg-[#fdfbf7] text-slate-700 min-h-screen pb-12 antialiased selection:bg-pink-100 selection:text-pink-600">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, className }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (className) i.setAttribute('class', className);
          iconRef.current.appendChild(i);
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} style={{ display: 'contents' }}></span>;
    };

    const ADMIN_PASSWORD = 'admin123';
    const DB_NAME = 'LinMaiCollectorDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'goods';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject('数据库打开失败');
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    };

    const getAllGoodsFromDB = async () => {
      try {
        const db = await initDB();
        return new Promise((resolve) => {
          const transaction = db.transaction(STORE_NAME, 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
        });
      } catch (err) {
        return [];
      }
    };

    const saveGoodsToDB = async (goodsList) => {
      try {
        const db = await initDB();
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        store.clear();
        goodsList.forEach(item => store.put(item));
      } catch (err) {}
    };

    const compressImage = (file, maxWidth = 1000, quality = 0.85) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            resolve(canvas.toDataURL(mimeType, quality));
          };
        };
      });
    };

    // --- 可交互 3D 图片渲染组件 (价格固定不动) ---
    const ThreeDImageCard = ({ src, alt, enable3D, className, priceText, priceColor, priceSize, priceItalic, children }) => {
      const [rotation, setRotation] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const startPos = useRef({ x: 0, y: 0 });

      // 价格标签 (独立置顶不跟随 3D 旋转)
      const renderPriceBadge = () => {
        if (!priceText) return null;
        return (
          <div 
            className={`absolute bottom-2 right-2 font-black drop-shadow-md px-2 py-0.5 rounded-md backdrop-blur-[3px] bg-white/40 z-20 pointer-events-none ${priceSize || 'text-sm'} ${priceItalic ? 'italic' : ''}`}
            style={{ color: priceColor || '#f43f5e' }}
          >
            {priceText}
          </div>
        );
      };

      if (!enable3D) {
        return (
          <div className="relative w-full h-full flex items-center justify-center">
            <img src={src} alt={alt} className={className} />
            {renderPriceBadge()}
            {children}
          </div>
        );
      }

      const handleMouseDown = (e) => {
        e.stopPropagation();
        setIsDragging(true);
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startPos.current = { x: clientX - rotation.y, y: clientY + rotation.x };
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        e.stopPropagation();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let rotY = clientX - startPos.current.x;
        let rotX = startPos.current.y - clientY;

        rotX = Math.max(-65, Math.min(65, rotX));
        rotY = Math.max(-65, Math.min(65, rotY));

        setRotation({ x: rotX, y: rotY });
      };

      const handleMouseUp = (e) => {
        if (isDragging) {
          e.stopPropagation();
          setIsDragging(false);
        }
      };

      return (
        <div 
          className="perspective-container relative w-full h-full flex items-center justify-center cursor-grab active:cursor-grabbing select-none"
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
          onTouchStart={handleMouseDown}
          onTouchMove={handleMouseMove}
          onTouchEnd={handleMouseUp}
        >
          {/* 旋转画面层 */}
          <div 
            className="preserve-3d w-full h-full flex items-center justify-center relative transition-transform duration-75"
            style={{ 
              transform: `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`,
              filter: `drop-shadow(${rotation.y * -0.25}px ${rotation.x * 0.25 + 8}px 14px rgba(0,0,0,0.18))`
            }}
          >
            <img src={src} alt={alt} className={`${className} pointer-events-none`} />
            {children}
          </div>

          {/* 价格标签固定居前 */}
          {renderPriceBadge()}

          {/* 3D 提示角标 */}
          <div className="absolute top-2 right-2 z-20 flex gap-1 items-center">
            {(rotation.x !== 0 || rotation.y !== 0) && (
              <button 
                onClick={(e) => { e.stopPropagation(); setRotation({ x: 0, y: 0 }); }}
                className="bg-black/60 hover:bg-black text-white text-[9px] px-1.5 py-0.5 rounded-full backdrop-blur-md shadow"
              >
                复位
              </button>
            )}
            <span className="bg-pink-500/80 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full backdrop-blur-md">
              3D
            </span>
          </div>
        </div>
      );
    };

    const DEFAULT_CATEGORIES = [
      { id: 'cat-1', name: '吧唧类目' },
      { id: 'cat-2', name: '明信片类目' },
      { id: 'cat-3', name: '72h类目' },
      { id: 'cat-4', name: '小卡类目' },
      { id: 'cat-5', name: '满赠类目' },
      { id: 'cat-6', name: '特签类目' },
      { id: 'cat-7', name: '线下限定满赠类目' },
    ];

    const DEFAULT_HERO_IMG = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop';
    const DEFAULT_FOOTER_IMG = 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1200&auto=format&fit=crop';

    function App() {
      const [isAdmin, setIsAdmin] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [selectedTag, setSelectedTag] = useState('');

      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('collector_categories');
        return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
      });
      const [heroImage, setHeroImage] = useState(() => localStorage.getItem('collector_hero_img') || DEFAULT_HERO_IMG);
      const [footerImage, setFooterImage] = useState(() => localStorage.getItem('collector_footer_img') || DEFAULT_FOOTER_IMG);

      const [activeCatId, setActiveCatId] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [goods, setGoods] = useState([]);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isCatManageOpen, setIsCatManageOpen] = useState(false);
      const [previewItem, setPreviewItem] = useState(null); 
      const [editingGoods, setEditingGoods] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');

      // 彩蛋区 Modal State
      const [isEggOpen, setIsEggOpen] = useState(false);
      const [standeeImages, setStandeeImages] = useState(() => {
        const saved = localStorage.getItem('collector_standees');
        return saved ? JSON.parse(saved) : [];
      });

      // 表单数据
      const [formData, setFormData] = useState({
        name: '', categoryId: '', image: '', statusTag: '渡野居', tags: '渡野居', count: 1, note: '', 
        aspectRatio: 'aspect-square',
        enable3D: false,
        priceText: '',
        priceColor: '#f43f5e',
        priceSize: 'text-sm',
        priceItalic: false,
        sizeInfo: ''
      });

      useEffect(() => {
        getAllGoodsFromDB().then(async (data) => {
          if (data && data.length > 0) {
            setGoods(data);
          } else {
            try {
              const res = await fetch('./data.json');
              if (res.ok) {
                const remoteData = await res.json();
                if (remoteData.goods) {
                  setGoods(remoteData.goods);
                  saveGoodsToDB(remoteData.goods);
                }
                if (remoteData.categories) setCategories(remoteData.categories);
              }
            } catch (err) {}
          }
        });
      }, []);

      useEffect(() => localStorage.setItem('collector_categories', JSON.stringify(categories)), [categories]);
      useEffect(() => localStorage.setItem('collector_hero_img', heroImage), [heroImage]);
      useEffect(() => localStorage.setItem('collector_footer_img', footerImage), [footerImage]);
      useEffect(() => localStorage.setItem('collector_standees', JSON.stringify(standeeImages)), [standeeImages]);

      const updateGoodsList = (newList) => {
        setGoods(newList);
        saveGoodsToDB(newList);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === ADMIN_PASSWORD) {
          setIsAdmin(true);
          setShowLoginModal(false);
          setPasswordInput('');
          setIsMenuOpen(false);
        } else {
          alert('密码错误！');
        }
      };

      const exportDataJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
          categories, goods, heroImage, footerImage, standeeImages
        }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importDataJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.goods) updateGoodsList(parsed.goods);
              if (parsed.categories) setCategories(parsed.categories);
              if (parsed.heroImage) setHeroImage(parsed.heroImage);
              if (parsed.footerImage) setFooterImage(parsed.footerImage);
              if (parsed.standeeImages) setStandeeImages(parsed.standeeImages);
              alert('数据导入成功！');
            } catch (err) {
              alert('数据文件解析格式失败！');
            }
          };
        }
      };

      const moveCategory = (index, direction) => {
        const newCats = [...categories];
        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= newCats.length) return;
        const temp = newCats[index];
        newCats[index] = newCats[targetIndex];
        newCats[targetIndex] = temp;
        setCategories(newCats);
      };

      const handleGoodsSubmit = (e) => {
        e.preventDefault();
        if (!formData.name) return alert('请输入周边名称');
        let targetCat = formData.categoryId || categories[0]?.id || 'cat-1';

        const formattedTags = formData.tags
          .replace(/，/g, ',')
          .split(',')
          .map(t => t.trim().replace(/^#/, ''))
          .filter(Boolean);

        const payload = {
          ...formData,
          categoryId: targetCat,
          tags: formattedTags,
          aspectRatio: formData.aspectRatio || 'aspect-square'
        };

        if (editingGoods) {
          const updated = goods.map(g => g.id === editingGoods.id ? { ...payload, id: editingGoods.id } : g);
          updateGoodsList(updated);
        } else {
          const newGood = { ...payload, id: `good-${Date.now()}`, createdAt: Date.now() };
          updateGoodsList([newGood, ...goods]);
        }
        closeModal();
      };

      const handleDeleteGood = (id, e) => {
        e.stopPropagation();
        if (confirm('确定要删除这个周边记录吗？')) {
          updateGoodsList(goods.filter(g => g.id !== id));
        }
      };

      const openEditModal = (item, e) => {
        e.stopPropagation();
        setEditingGoods(item);
        setFormData({
          name: item.name,
          categoryId: item.categoryId,
          image: item.image,
          statusTag: item.statusTag || '渡野居',
          tags: Array.isArray(item.tags) ? item.tags.join(', ') : (item.tags || ''),
          count: item.count || 1,
          note: item.note || '',
          aspectRatio: item.aspectRatio || 'aspect-square',
          enable3D: !!item.enable3D,
          priceText: item.priceText || '',
          priceColor: item.priceColor || '#f43f5e',
          priceSize: item.priceSize || 'text-sm',
          priceItalic: !!item.priceItalic,
          sizeInfo: item.sizeInfo || ''
        });
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingGoods(null);
        setFormData({ 
          name: '', categoryId: '', image: '', statusTag: '渡野居', tags: '', count: 1, note: '', 
          aspectRatio: 'aspect-square', enable3D: false, priceText: '', priceColor: '#f43f5e', priceSize: 'text-sm', priceItalic: false, sizeInfo: '' 
        });
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file);
          setFormData(prev => ({ ...prev, image: compressed }));
        }
      };

      const handleStandeeUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file, 800, 0.9);
          setStandeeImages(prev => [compressed, ...prev]);
        }
      };

      const filteredGoods = goods.filter(item => {
        const matchesCat = activeCatId === 'all' || item.categoryId === activeCatId;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (item.note && item.note.toLowerCase().includes(searchQuery.toLowerCase())) ||
                              (item.sizeInfo && item.sizeInfo.toLowerCase().includes(searchQuery.toLowerCase()));
        
        const itemTags = Array.isArray(item.tags) ? item.tags : [];
        const matchesSelectedTag = !selectedTag || itemTags.includes(selectedTag);

        return matchesCat && matchesSearch && matchesSelectedTag;
      });

      return (
        <div className="max-w-6xl mx-auto bg-[#fffefb] min-h-screen shadow-xl relative flex flex-col justify-between border-x border-pink-100/50">
          
          <div>
            {/* --- 首页 Banner 区域 (圆润猫头形状) --- */}
            <div className="pt-6 px-4 flex justify-center">
              <div className="relative w-full max-w-2xl h-56 sm:h-72 rounded-[3.5rem] bg-pink-100 overflow-hidden shadow-lg group border-4 border-pink-200/80">
                
                {/* 猫耳拱形顶部修饰 */}
                <div className="absolute -top-6 left-12 w-20 h-20 bg-pink-300 rounded-full border-4 border-pink-200"></div>
                <div className="absolute -top-6 right-12 w-20 h-20 bg-pink-300 rounded-full border-4 border-pink-200"></div>

                <img 
                  src={heroImage} 
                  alt="凛麦图鉴 Banner" 
                  className="w-full h-full object-cover relative z-10 group-hover:scale-105 transition-transform duration-700 ease-out"
                />
                <div className="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-slate-950/10 to-transparent z-20"></div>

                <div className="absolute bottom-6 left-6 right-6 flex justify-between items-end z-30">
                  <div>
                    <span className="inline-block px-3.5 py-1 bg-pink-300/90 backdrop-blur-md text-pink-900 text-xs font-bold rounded-full mb-1.5 tracking-wide shadow-sm">
                      IP: 于是麦麦决定离家出走
                    </span>
                    <h1 className="text-3xl sm:text-4xl font-black text-white tracking-tight drop-shadow-md">
                      凛麦图鉴
                    </h1>
                  </div>

                  {isAdmin && (
                    <label className="cursor-pointer bg-white/30 hover:bg-white/40 backdrop-blur-md text-slate-800 text-xs px-3 py-1.5 rounded-2xl border border-white/40 transition flex items-center gap-1.5 shadow-sm font-semibold">
                      <Icon name="camera" className="w-3.5 h-3.5" />
                      <span className="hidden sm:inline">换猫头图</span>
                      <input type="file" accept="image/*" className="hidden" onChange={async (e) => {
                        const file = e.target.files[0];
                        if (file) setHeroImage(await compressImage(file, 1200, 0.8));
                      }} />
                    </label>
                  )}
                </div>
              </div>
            </div>

            {/* --- 搜索与筛选控制栏 --- */}
            <div className="sticky top-0 z-30 bg-[#fffefb]/90 backdrop-blur-md border-b border-pink-100/60 p-4 shadow-sm mt-4">
              <div className="flex flex-col sm:flex-row gap-4 items-center justify-between">
                
                {/* 猫咪造型搜索框 */}
                <div className="relative w-full sm:w-80 flex items-center my-1">
                  <div className="cat-ear-left"></div>
                  <div className="cat-ear-right"></div>
                  <div className="cat-tail"></div>

                  <div className="relative w-full flex items-center z-10">
                    <Icon name="search" className="w-4 h-4 absolute left-3.5 text-pink-400" />
                    <input 
                      type="text" 
                      placeholder="搜索谷子名称、尺寸、备注..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-10 pr-8 py-2 bg-pink-50/60 border-2 border-pink-200/80 rounded-2xl text-sm text-slate-700 placeholder-pink-300 focus:bg-white focus:border-pink-400 focus:outline-none transition shadow-inner"
                    />
                    {searchQuery && (
                      <button onClick={() => setSearchQuery('')} className="absolute right-3 text-pink-300 hover:text-pink-500">
                        <Icon name="x" className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                </div>

                {selectedTag && (
                  <div className="flex items-center gap-2 bg-pink-100/80 px-3 py-1 rounded-full border border-pink-300">
                    <span className="text-xs text-pink-700 font-semibold">包含标签: #{selectedTag}</span>
                    <button onClick={() => setSelectedTag('')} className="text-pink-500 hover:text-pink-700">
                      <Icon name="x" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                )}

                {isAdmin && (

                    <label className="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" checked={formData.enable3D} onChange={(e) => setFormData({ ...formData, enable3D: e.target.checked })} className="sr-only peer" />
                      <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-pink-400"></div>
                    </label>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">图片展示比例</label>
                    <select value={formData.aspectRatio} onChange={(e) => setFormData({ ...formData, aspectRatio: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm font-medium">
                      <option value="aspect-square">1 : 1 正方形 (吧唧/色纸)</option>
                      <option value="aspect-[3/4]">3 : 4 纵向长方形 (立牌/明信片/小卡)</option>
                      <option value="aspect-[4/3]">4 : 3 横向长方形 (海报/画幅)</option>
                      <option value="aspect-auto">完整适应（不裁切全图显示）</option>
                    </select>
                  </div>

                  {/* 价格与字体增强设定 */}
                  <div className="p-3 bg-slate-50 border border-slate-100 rounded-2xl space-y-3">
                    <label className="block text-xs font-bold text-slate-700">图片右下角标（价格/标识文本）</label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <input type="text" placeholder="如：￥25" value={formData.priceText} onChange={(e) => setFormData({ ...formData, priceText: e.target.value })} className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs" />
                      
                      {/* 字号加宽加大选择 */}
                      <select value={formData.priceSize} onChange={(e) => setFormData({ ...formData, priceSize: e.target.value })} className="px-2 py-1.5 bg-white border border-slate-200 rounded-xl text-xs">
                        <option value="text-xs">字号: 小</option>
                        <option value="text-sm">字号: 中 (默认)</option>
                        <option value="text-base">字号: 大</option>
                        <option value="text-lg">字号: 特大</option>
                        <option value="text-xl">字号: 超大 2XL</option>
                        <option value="text-2xl">字号: 巨型 3XL</option>
                      </select>
                    </div>

                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2 bg-white px-3 py-1.5 border border-slate-200 rounded-xl flex-grow">
                        <span className="text-xs text-slate-500 whitespace-nowrap">颜色色盘:</span>
                        <input type="color" value={formData.priceColor} onChange={(e) => setFormData({ ...formData, priceColor: e.target.value })} className="w-6 h-6 rounded-lg cursor-pointer border-0 bg-transparent" />
                      </div>

                      <label className="flex items-center gap-1.5 bg-white px-3 py-1.5 border border-slate-200 rounded-xl cursor-pointer">
                        <input type="checkbox" checked={formData.priceItalic} onChange={(e) => setFormData({ ...formData, priceItalic: e.target.checked })} className="rounded text-pink-500 focus:ring-0" />
                        <span className="text-xs font-bold italic text-slate-700">斜体效果</span>
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">谷子名称 *</label>
                    <input type="text" required placeholder="如：凛麦特签预售吧唧" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5">所属分类</label>
                      <select value={formData.categoryId || categories[0]?.id} onChange={(e) => setFormData({ ...formData, categoryId: e.target.value })} className="w-full px-3 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-xs">
                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5">尺寸项 (可选)</label>
                      <input type="text" placeholder="如: 58mm" value={formData.sizeInfo} onChange={(e) => setFormData({ ...formData, sizeInfo: e.target.value })} className="w-full px-3 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-xs" />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1.5">持有数量</label>
                      <input type="number" min="1" value={formData.count} onChange={(e) => setFormData({ ...formData, count: parseInt(e.target.value) || 1 })} className="w-full px-3 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-xs" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">左上角角标文字</label>
                    <input type="text" placeholder="如：渡野居、求购中" value={formData.statusTag} onChange={(e) => setFormData({ ...formData, statusTag: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">谷子标签 (用逗号分隔)</label>
                    <input type="text" placeholder="如：渡野居, 预售, 72h" value={formData.tags} onChange={(e) => setFormData({ ...formData, tags: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">详细备注/工艺</label>
                    <textarea rows="2" placeholder="如：流沙工艺..." value={formData.note} onChange={(e) => setFormData({ ...formData, note: e.target.value })} className="w-full px-3.5 py-2 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm"></textarea>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={closeModal} className="px-4 py-2 bg-slate-100 text-slate-600 text-sm font-medium rounded-2xl">取消</button>
                    <button type="submit" className="px-5 py-2 bg-pink-400 text-white text-sm font-semibold rounded-2xl shadow-md">保存收录</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
